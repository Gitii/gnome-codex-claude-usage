name: Package

# Builds the Debian package in Ubuntu 24.04 (GNOME Shell 46) and Ubuntu 26.04
# (GNOME Shell 50) containers, runs the test suite in each, and attaches the
# .deb files to the GitHub release when a v* tag is pushed.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Create a GitHub release with this tag (e.g. v1.1.2) from the chosen
          branch. The tag is created by the release job and must match the
          version in debian/changelog. Leave empty for a plain build.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  deb:
    name: deb (Ubuntu ${{ matrix.ubuntu }}, GNOME ${{ matrix.gnome }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            gnome: '46'
          - ubuntu: '26.04'
            gnome: '50'
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates make zip python3 nodejs \
            libglib2.0-bin libglib2.0-dev-bin gjs gir1.2-soup-3.0 \
            build-essential dpkg-dev debhelper devscripts lintian libdistro-info-perl
      - uses: actions/checkout@v4
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check that this Ubuntu ships the expected GNOME Shell
        run: |
          candidate="$(apt-cache show gnome-shell | sed -n 's/^Version: //p' | head -n1)"
          echo "gnome-shell in Ubuntu ${{ matrix.ubuntu }}: $candidate"
          case "$candidate" in
            ${{ matrix.gnome }}.*) ;;
            *) echo "expected GNOME ${{ matrix.gnome }}"; exit 1 ;;
          esac

      - name: Unit tests, syntax and schema
        run: make check
      - name: Provider integration tests (gjs + mock API)
        run: make test-providers

      - name: Set package version
        id: version
        run: |
          . /etc/os-release
          changelog="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            upstream="${GITHUB_REF#refs/tags/v}"
            debver="${upstream}-1~ubuntu${VERSION_ID}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            upstream="${RELEASE_TAG#v}"
            if [[ "$upstream" != "$changelog" ]]; then
              echo "release_tag $RELEASE_TAG does not match debian/changelog version $changelog"
              exit 1
            fi
            debver="${upstream}-1~ubuntu${VERSION_ID}"
          else
            upstream="$changelog"
            debver="${upstream}-0+git$(date -u +%Y%m%d).${GITHUB_SHA::7}~ubuntu${VERSION_ID}"
          fi
          dch -b -v "$debver" -D "$VERSION_CODENAME" --force-distribution \
            "Automated build for Ubuntu ${VERSION_ID} (GNOME Shell ${{ matrix.gnome }})."
          echo "debver=$debver" >> "$GITHUB_OUTPUT"
        env:
          DEBEMAIL: gitii@users.noreply.github.com
          DEBFULLNAME: Gitii
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../gnome-shell-extension-codex-claude-usage_*.deb dist/
          ls -l dist
          dpkg -I dist/*.deb
          lintian --no-tag-display-limit dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-${{ matrix.ubuntu }}-gnome-${{ matrix.gnome }}
          path: dist/*.deb
          if-no-files-found: error

  # Runs on a v* tag push, or on manual dispatch with release_tag set (the
  # action then creates the tag on the dispatched commit).
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.deb
          generate_release_notes: true
